<section class="container my-5">
  <div class="row justify-content-center align-items-center">
    <div class="col-md-6 mt-3">
      <img src="{{ product?.imageUrl }}" alt="" class="img-fluid rounded" />
    </div>
  </div>
  <div class="row justify-content-center align-items-center">
    <h2 class="fw bold col-md-6 mt-3">
      {{ product?.name }}
    </h2>
  </div>
  <div class="row justify-content-center align-items-center">
    <h5 class="fw bold col-md-6 mt-3">Rating: {{ product?.rating }}</h5>
  </div>
  <div class="row justify-content-center align-items-center">
    <div class="fw bold col-md-6 mt-3">{{ product?.description }}</div>
  </div>
  <div class="row justify-content-center align-items-center">
    <h4 class="fw bold col-md-6 mt-3" style="color: red">€{{ product?.price }}</h4>
  </div>
  <div class="row justify-content-center align-items-center">
    <a (click)="addToCart(product)" class="col-md-1 btn btn-primary">Add to Cart</a>
  </div>
</section>
